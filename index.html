<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jess Nails & Lashes</title>

<style>
body{
font-family:Arial,sans-serif;
background:#fff5f8;
margin:0;
padding:0;
}

header{
background:linear-gradient(135deg,#ffb6c1,#ffffff);
padding:40px;
text-align:center;
}

h1{
color:#d63384;
margin-bottom:10px;
}

.logo{
font-size:50px;
font-weight:bold;
color:#d63384;
}

.container{
max-width:600px;
margin:30px auto;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 0 15px rgba(0,0,0,0.1);
}

input,select{
width:100%;
padding:12px;
margin-top:10px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:10px;
box-sizing:border-box;
}

button{
width:100%;
padding:15px;
background:#ff69b4;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#e754a3;
}

footer{
text-align:center;
padding:20px;
color:#777;
}
</style>
</head>

<body>

<header>
<div class="logo">JN</div>
<h1>Jess Nails & Lashes</h1>
<p>Beauty • Elegance • Confidence</p>
</header>

<div class="container">

<h2>Book Your Appointment</h2>

<input type="text" id="name" placeholder="Full Name">

<input type="tel" id="phone" placeholder="Mobile Number">

<select id="service">
<option>Hard Gel</option>
<option>Hard Gel + Design</option>
<option>Gel Polish</option>
<option>Lashes</option>
<option>Fake Nails</option>
</select>

<input type="date" id="date">

<select id="time">
<option>09:00 AM</option>
<option>10:30 AM</option>
<option>12:00 PM</option>
<option>01:30 PM</option>
<option>03:00 PM</option>
<option>04:30 PM</option>
</select>

<button onclick="bookNow()">Confirm Booking</
</div>

<footer>
Jess Nails & Lashes ©️ 2026
</footer>

<script>

function bookNow(){

let name=document.getElementById("name").value;
let phone=document.getElementById("phone").value;
let service=document.getElementById("service").value;
let date=document.getElementById("date").value;
let time=document.getElementById("time").value;

let message =
`Hello Jess 💗

Name: ${name}
Phone: ${phone}
Service: ${service}
Date: ${date}
Time: ${time}`;

window.open(
`https://wa.me/201015136510?text=${encodeURIComponent(message)}`,
'_blank'
);

}

</script>

</body>
</html>
