<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCV2nvXk0CGBHQWYpLcuMWxt3_zFqDLdIhI",
  authDomain: "jess-nails-lashes.firebaseapp.com",
  projectId: "jess-nails-lashes",
  storageBucket: "jess-nails-lashes.firebasestorage.app",
  messagingSenderId: "586286309255",
  appId: "1:586286309255:web:950f57d31d7d25052cbd22"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.bookNow = async function () {

let name = document.getElementById("name").value;
let phone = document.getElementById("phone").value;
let service = document.getElementById("service").value;
let date = document.getElementById("date").value;
let time = document.getElementById("time").value;

try {

await addDoc(collection(db, "bookings"), {
name,
phone,
service,
date,
time,
createdAt: new Date()
});

let message =
`Hello Jess 💗

Name: ${name}
Phone: ${phone}
Service: ${service}
Date: ${date}
Time: ${time}`;

window.open(
`https://wa.me/201015136510?text=${encodeURIComponent(message)}`,
'_blank'
);

} catch(error) {
alert("Error saving booking");
console.error(error);
}

}

</script>
